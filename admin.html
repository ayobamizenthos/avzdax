<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Newsroom | AVZDAX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
    <link href="/components/admin-styles.css" rel="stylesheet">
</head>
<body>

<section id="gate" class="gate hidden">
    <form class="gate-card" id="gate-form">
        <img class="gate-mark" src="/media/avzdax-logo.png" alt="AVZDAX">
        <h1 class="gate-title">Newsroom</h1>
        <p class="gate-sub">Sign in to write and publish.</p>
        <p id="gate-error" class="gate-error hidden"></p>
        <div class="field">
            <label class="field-label" for="gate-password">Password</label>
            <div class="password-field">
                <input type="password" id="gate-password" autocomplete="current-password" required>
                <button type="button" class="peek" id="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1.6 12S5.2 5.6 12 5.6 22.4 12 22.4 12 18.8 18.4 12 18.4 1.6 12 1.6 12z"></path>
                        <circle cx="12" cy="12" r="3.1"></circle>
                        <path class="peek-slash" d="M3.5 3.5l17 17"></path>
                    </svg>
                </button>
            </div>
        </div>
        <button class="btn btn-block" type="submit">Sign in</button>
    </form>
</section>

<div id="app" class="hidden">
    <header class="topbar">
        <div class="topbar-row">
            <a class="brand" href="/news" title="View the news page">
                <img src="/media/avzdax-logo.png" alt="AVZDAX">
            </a>
            <div class="topbar-right">
                <button class="ghost" id="sign-out">Sign out</button>
                <button class="btn btn-pill" id="new-post">Write</button>
            </div>
        </div>
    </header>

    <main id="view-posts" class="reading">
        <h1 class="page-title">Your stories</h1>

        <nav class="tabs" id="tabs" role="tablist">
            <button class="tab on" data-tab="published" role="tab" aria-selected="true">Published<span class="count" id="count-published">0</span></button>
            <button class="tab" data-tab="draft" role="tab" aria-selected="false">Drafts<span class="count" id="count-draft">0</span></button>
            <button class="tab" data-tab="images" role="tab" aria-selected="false">Images</button>
        </nav>

        <p class="tab-note" id="tab-hint"></p>

        <div id="post-rows"></div>

        <div id="media-panel" class="hidden">
            <button class="btn btn-pill media-add" id="media-add">Upload an image</button>
            <div class="media-grid" id="media-grid"></div>
        </div>
    </main>

    <div id="view-editor" class="hidden">
        <div class="editor-bar">
            <div class="editor-bar-row">
                <button class="ghost" id="editor-back">Stories</button>
                <div class="editor-bar-right">
                    <span class="save-state" id="save-state"></span>
                    <button class="ghost" id="open-settings">Settings</button>
                    <button class="btn btn-pill" id="editor-save">Save</button>
                </div>
            </div>
        </div>

        <div class="compose">
            <input type="text" class="title-input" id="f-title" placeholder="Title" autocomplete="off">
            <textarea class="excerpt-input" id="f-excerpt" rows="2" placeholder="A one-line summary for the card"></textarea>
            <div id="body-card">
                <div class="writing" id="f-content" contenteditable="true" data-placeholder="Tell your story."></div>
            </div>
        </div>

        <div class="float-toolbar hidden" id="float-toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-cmd="bold" aria-label="Bold"><strong>B</strong></button>
            <button type="button" data-cmd="italic" aria-label="Italic"><em>i</em></button>
            <span class="fsep"></span>
            <button type="button" data-block="h3" aria-label="Heading">H</button>
            <button type="button" data-block="h4" aria-label="Subheading">h</button>
            <button type="button" data-block="blockquote" aria-label="Quote">&rdquo;</button>
            <span class="fsep"></span>
            <button type="button" id="tb-link" aria-label="Add link">Link</button>
        </div>

        <div class="insert-bar">
            <button type="button" class="ghost" id="tb-image">Insert image</button>
            <button type="button" class="ghost" data-cmd="insertUnorderedList">Bulleted list</button>
            <button type="button" class="ghost" data-block="p">Plain text</button>
        </div>
    </div>

    <aside class="settings" id="settings" aria-hidden="true">
        <div class="settings-panel">
            <div class="settings-head">
                <h2>Story settings</h2>
                <button class="ghost" id="close-settings" aria-label="Close settings">Done</button>
            </div>

            <div class="settings-body">
                <div class="field">
                    <label class="field-label" for="f-status">Status</label>
                    <select id="f-status">
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="f-category">Section</label>
                    <select id="f-category">
                        <option value="insight">Insight</option>
                        <option value="broadcast">Broadcast</option>
                        <option value="blog">Blog</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="f-layout">Card size on the news page</label>
                    <select id="f-layout">
                        <option value="standard">Standard</option>
                        <option value="featured">Featured</option>
                        <option value="wide">Wide</option>
                    </select>
                </div>
                <div class="field">
                    <label class="field-label" for="f-kind">This entry is</label>
                    <select id="f-kind">
                        <option value="article">A story written here</option>
                        <option value="video">A YouTube video</option>
                        <option value="external">A link elsewhere</option>
                    </select>
                </div>
                <div class="field hidden" id="wrap-video">
                    <label class="field-label" for="f-video">YouTube link</label>
                    <input type="url" id="f-video" placeholder="https://youtu.be/">
                </div>
                <div class="field hidden" id="wrap-external">
                    <label class="field-label" for="f-external">Link address</label>
                    <input type="url" id="f-external" placeholder="https://">
                </div>
                <div class="field">
                    <label class="field-label" for="f-linklabel">Button wording</label>
                    <input type="text" id="f-linklabel" placeholder="Read Analysis">
                </div>

                <div class="field">
                    <span class="field-label">Cover image</span>
                    <div class="cover" id="cover-drop">
                        <img id="cover-preview" class="hidden" alt="">
                        <p class="cover-hint" id="cover-hint">Drag an image here, or choose one.</p>
                        <div class="cover-actions">
                            <button class="btn btn-pill btn-quiet" type="button" id="cover-pick">Choose image</button>
                            <button class="ghost danger hidden" type="button" id="cover-clear">Remove</button>
                        </div>
                    </div>
                </div>

                <button class="ghost danger settings-delete" type="button" id="editor-delete">Delete this story</button>
            </div>
        </div>
    </aside>
</div>

<output id="flash" class="status hidden" role="status"></output>

<dialog id="ask" class="ask">
    <form method="dialog" class="ask-card">
        <h2 class="ask-title" id="ask-title"></h2>
        <p class="ask-body" id="ask-body"></p>
        <div class="field ask-field hidden" id="ask-field">
            <label class="field-label" for="ask-input" id="ask-label"></label>
            <input type="text" id="ask-input" autocomplete="off">
        </div>
        <div class="ask-actions">
            <button type="button" class="ghost" id="ask-cancel">Cancel</button>
            <button type="button" class="btn btn-pill" id="ask-confirm">Confirm</button>
        </div>
    </form>
</dialog>

<input type="file" id="file-input" accept="image/*" class="hidden">
<script src="/components/admin.js"></script>

</body>
</html>

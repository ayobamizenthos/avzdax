<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Newsroom | AVZDAX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
    <link href="/components/admin-styles.css" rel="stylesheet">
</head>
<body>

<svg class="sprite" aria-hidden="true">
    <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 5h6.2a3.8 3.8 0 0 1 0 7.6H7zM7 12.6h7a3.9 3.9 0 0 1 0 7.8H7z"/></symbol>
    <symbol id="i-italic" viewBox="0 0 24 24"><path d="M15 5h-5M14 19H9M13.5 5 10.5 19"/></symbol>
    <symbol id="i-heading" viewBox="0 0 24 24"><path d="M6 5v14M18 5v14M6 12h12"/></symbol>
    <symbol id="i-sub" viewBox="0 0 24 24"><path d="M7 7v10M15 7v10M7 12h8"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9 7c-2.2 0-4 1.8-4 4s1.8 4 4 4c0 2-1.4 3-3 3M20 7c-2.2 0-4 1.8-4 4s1.8 4 4 4c0 2-1.4 3-3 3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.5-4.5L13 16l2.5-2.5L19.5 17"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8 6 12l4 4M6 12h9"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
</svg>

<section id="gate" class="gate hidden">
    <a class="gate-brand" href="/news" title="View the site">
        <img src="/media/avzdax-logo.png" alt="AVZDAX">
    </a>
    <form class="gate-card" id="gate-form">
        <h1 class="gate-title">Newsroom</h1>
        <p class="gate-sub">Sign in to write and publish.</p>
        <p id="gate-error" class="gate-error hidden"></p>
        <div class="field">
            <label class="field-label" for="gate-password">Password</label>
            <div class="password-field">
                <input type="password" id="gate-password" autocomplete="current-password" required>
                <button type="button" class="peek" id="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1.6 12S5.2 5.6 12 5.6 22.4 12 22.4 12 18.8 18.4 12 18.4 1.6 12 1.6 12z"></path>
                        <circle cx="12" cy="12" r="3.1"></circle>
                        <path class="peek-slash" d="M3.5 3.5l17 17"></path>
                    </svg>
                </button>
            </div>
        </div>
        <button class="btn" type="submit">Sign in</button>
    </form>
</section>

<div id="app" class="hidden">
    <header class="bar">
        <a class="brand" href="/news" title="View the news page">
            <img src="/media/avzdax-logo.png" alt="AVZDAX">
        </a>
        <button class="icon-btn" id="sign-out" aria-label="Sign out" title="Sign out">
            <svg aria-hidden="true"><use href="#i-exit"></use></svg>
        </button>
    </header>

    <main id="view-posts" class="wrap">
        <div class="page-head">
            <h1 class="page-title">Newsroom</h1>
            <button class="btn btn-small" id="new-post">Write</button>
        </div>

        <div class="filters" id="post-filters" role="tablist" aria-label="Filter entries">
            <button class="filter on" data-tab="all" role="tab" aria-selected="true">All<span id="count-all">0</span></button>
            <button class="filter" data-tab="published" role="tab" aria-selected="false">Published<span id="count-published">0</span></button>
            <button class="filter" data-tab="draft" role="tab" aria-selected="false">Drafts<span id="count-draft">0</span></button>
            <button class="filter" data-tab="images" role="tab" aria-selected="false">Images</button>
        </div>

        <div id="post-rows"></div>

        <div id="media-panel" class="hidden">
            <button class="btn btn-small media-add" id="media-add">Upload an image</button>
            <div class="media-grid" id="media-grid"></div>
        </div>
    </main>

    <div id="view-editor" class="hidden">
        <div class="editor-top">
            <button class="icon-btn" id="editor-back" aria-label="Back to entries" title="Back to entries">
                    <svg aria-hidden="true"><use href="#i-back"></use></svg>
                </button>
            <div class="editor-top-right">
                <span class="save-state" id="save-state"></span>
                <button class="icon-btn settings-toggle" id="open-settings" aria-label="Post settings">
                    <svg aria-hidden="true"><use href="#i-settings"></use></svg>
                </button>
                <button class="btn btn-small" id="editor-save">Save</button>
            </div>
        </div>


        <div class="sel-bar hidden" id="toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
            <button type="button" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
            <button type="button" id="tb-link" aria-label="Link" title="Link"><svg aria-hidden="true"><use href="#i-link"></use></svg></button>
            <span class="tsep"></span>
            <button type="button" data-block="h3" aria-label="Heading" title="Heading"><b>H</b></button>
            <button type="button" data-block="h4" aria-label="Subheading" title="Subheading"><b class="small">H</b></button>
            <button type="button" data-block="blockquote" aria-label="Quote" title="Quote"><span class="quote">&rdquo;</span></button>
            <button type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list"><svg aria-hidden="true"><use href="#i-list"></use></svg></button>
            <span class="tsep"></span>
            <button type="button" data-block="p" aria-label="Plain text" title="Plain text"><span class="plain">Tt</span></button>
            <button type="button" id="tb-image" aria-label="Insert image" title="Insert image"><svg aria-hidden="true"><use href="#i-image"></use></svg></button>
        </div>

        <div class="editor-grid">
            <div class="compose">
                <input type="text" class="title-input" id="f-title" placeholder="Title" autocomplete="off">
                <textarea class="excerpt-input" id="f-excerpt" rows="2" placeholder="A one-line summary for the news card"></textarea>
                <div id="body-card">
                    <div class="writing" id="f-content" contenteditable="true" data-placeholder="Write the post."></div>
                </div>
            </div>

            <aside class="side" id="settings">
                <div class="side-panel">
                    <div class="side-head">
                        <button class="ghost side-close" id="close-settings">Done</button>
                    </div>
                    <div class="side-body">
                        <div class="field">
                            <label class="field-label" for="f-status">Status</label>
                            <select id="f-status">
                                <option value="published">Published</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label" for="f-category">Section</label>
                            <select id="f-category">
                                <option value="insight">Insight</option>
                                <option value="broadcast">Broadcast</option>
                                <option value="blog">Blog</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label" for="f-layout">Card size on the news page</label>
                            <select id="f-layout">
                                <option value="standard">Standard</option>
                                <option value="featured">Featured</option>
                                <option value="wide">Wide</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="field-label" for="f-kind">This entry is</label>
                            <select id="f-kind">
                                <option value="article">An article written here</option>
                                <option value="video">A YouTube video</option>
                                <option value="external">A link elsewhere</option>
                            </select>
                        </div>
                        <div class="field hidden" id="wrap-video">
                            <label class="field-label" for="f-video">YouTube link</label>
                            <input type="url" id="f-video" placeholder="https://youtu.be/">
                        </div>
                        <div class="field hidden" id="wrap-external">
                            <label class="field-label" for="f-external">Link address</label>
                            <input type="url" id="f-external" placeholder="https://">
                        </div>
                        <div class="field">
                            <label class="field-label" for="f-linklabel">Button wording</label>
                            <input type="text" id="f-linklabel" placeholder="Read Analysis">
                        </div>
                        <div class="field">
                            <span class="field-label">Cover image</span>
                            <div class="cover" id="cover-drop">
                                <img id="cover-preview" class="hidden" alt="">
                                <p class="cover-hint" id="cover-hint">Drag an image here, or choose one.</p>
                                <div class="cover-actions">
                                    <button class="btn btn-small btn-quiet" type="button" id="cover-pick">Choose image</button>
                                    <button class="ghost danger hidden" type="button" id="cover-clear">Remove</button>
                                </div>
                            </div>
                        </div>
                        <button class="ghost danger side-delete" type="button" id="editor-delete">Delete this entry</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</div>

<output id="flash" class="status hidden" role="status"></output>

<dialog id="settings-sheet" class="sheet"></dialog>

<dialog id="picker" class="picker">
    <div class="picker-card">
        <div class="picker-head">
            <h2>Choose an image</h2>
            <div class="picker-head-actions">
                <button type="button" class="btn btn-small btn-quiet" id="picker-upload">Upload new</button>
                <button type="button" class="ghost" id="picker-close">Cancel</button>
            </div>
        </div>
        <div class="picker-grid" id="picker-grid"></div>
    </div>
</dialog>

<dialog id="ask" class="ask">
    <form method="dialog" class="ask-card">
        <h2 class="ask-title" id="ask-title"></h2>
        <p class="ask-body" id="ask-body"></p>
        <div class="field ask-field hidden" id="ask-field">
            <label class="field-label" for="ask-input" id="ask-label"></label>
            <input type="text" id="ask-input" autocomplete="off">
        </div>
        <div class="ask-actions">
            <button type="button" class="ghost" id="ask-cancel">Cancel</button>
            <button type="button" class="btn btn-small" id="ask-confirm">Confirm</button>
        </div>
    </form>
</dialog>

<input type="file" id="file-input" accept="image/*" class="hidden">
<script src="/components/admin.js"></script>

</body>
</html>

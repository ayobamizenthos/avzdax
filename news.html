            content: '';

        .news-container { width: 100%; max-width: 1800px; margin: 0 auto; padding: 220px 60px 100px; }
        
        .news-header-section { margin-bottom: 120px; }
        .news-hero-title { font-family: 'Syncopate'; font-size: 10vw; font-weight: 900; line-height: 0.85; letter-spacing: -0.06em; text-transform: uppercase; color: var(--ghost); }

        .news-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 40px; }

        
        .card-wrap { 
            position: relative; 
            background: #0a0a0a; 
            border: 1px solid rgba(255,255,255,0.08); 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-wrap:hover { transform: translateY(-10px); box-shadow: 0 40px 100px rgba(0,0,0,0.5); border-color: white; }

        .featured-card { grid-column: span 12; display: grid; grid-template-columns: repeat(12, 1fr); height: 650px; }
        .standard-card { grid-column: span 6; min-height: 700px; }
        .wide-card { grid-column: span 8; min-height: 600px; }
        .compact-card { grid-column: span 4; min-height: 600px; }

        
        .card-media { position: relative; overflow: hidden; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        .standard-card .card-media { height: 400px; }
        .card-img { width: 100%; height: 100%; object-fit: cover; object-position: center center; transition: transform 3s ease; opacity: 1; filter: contrast(1.1) brightness(0.9); }
        .card-wrap:hover .card-img { transform: scale(1.05); opacity: 1; filter: contrast(1) brightness(1.1); }
        .featured-card .card-media { grid-column: span 7; background: radial-gradient(circle at center, #1a1a1a 0%, #080808 100%); position: relative; height: 100%; }
        .featured-card .card-media .card-img { object-fit: contain; width: 90%; height: 90%; filter: drop-shadow(0 0 50px rgba(255,255,255,0.1)); }
        .featured-card .card-media::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #080808 0%, transparent 20%); pointer-events: none; }

        
        .card-body { padding: 60px; display: flex; flex-direction: column; flex-grow: 1; }
        .featured-card .card-body { grid-column: span 5; padding: 80px; justify-content: center; }
        
        .c-meta { font-family: 'JetBrains Mono'; font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.4); margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }

            text-transform: uppercase;

    <script>
        const intelDB = {};

        function buildReaderHtml(post) {
            const headline = post.headline || escapeText(post.title) + '.';
            return `
                    <div class="r-header">
                        <h1 class="r-title">${headline}</h1>
                    </div>

                    <div class="r-content-grid">
                        <div class="r-main-text">
                            <div class="r-body">${post.content}</div>
                        </div>

                        <div class="r-side-meta"></div>
                    </div>`;
        }

        const reader = document.getElementById('intel-reader');
        const readerContent = document.getElementById('reader-content-root');
        const closeReader = document.getElementById('close-reader');
        let savedScrollY = 0;

        async function openArticle(id) {
            const data = intelDB[id];
            if (!data) return;

            if (!data.content) {
                const response = await fetch('/api/posts?slug=' + encodeURIComponent(id));
                if (!response.ok) return;
                data.content = buildReaderHtml(await response.json());
            }

            savedScrollY = window.scrollY;

            const heroImg = data.img ? `<div class="r-hero-image"><img src="${data.img}" alt="${data.title}"></div>` : '';
            readerContent.innerHTML = heroImg + data.content;

            reader.style.display = 'block';
            reader.scrollTop = 0;
            document.body.classList.add('reader-open');
            history.pushState({ reader: id }, '', '#' + id);
            gsap.to(reader, { opacity: 1, duration: 0.8, ease: "power4.out" });
            

            gsap.from(".r-header, .r-content-grid > *", { 
                y: 50, opacity: 0, duration: 1.2, stagger: 0.1, ease: "power3.out", delay: 0.2 
            });


            setTimeout(() => {
                ScrollTrigger.refresh();
                const readerImages = reader.querySelectorAll('.r-grid-img');
                readerImages.forEach(img => {
                    gsap.to(img, {
                        y: -40,
                        scrollTrigger: {
                            trigger: img,
                            scroller: ".reader-overlay",
                            start: "top bottom",
                            end: "bottom top",
                            scrub: 1.5
                        }
                    });
                });
            }, 500);

            if (window.lenis) window.lenis.stop();
        }

        function closeArticle() {
            gsap.to(reader, { opacity: 0, duration: 0.4, onComplete: () => {
                reader.style.display = 'none';
                document.body.classList.remove('reader-open');
                window.scrollTo(0, savedScrollY);
                if (window.lenis) {
                    window.lenis.start();
                    window.lenis.scrollTo(savedScrollY, { immediate: true });
                }
            }});
            history.replaceState(null, '', window.location.pathname);
        }

        closeReader.addEventListener('click', () => {
            if (history.state && history.state.reader) {
                history.back();
            } else {
                closeArticle();
            }
        });

        window.addEventListener('popstate', () => {
            if (reader.style.display === 'block') {
                closeArticle();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && reader.style.display === 'block') {
                closeReader.click();
            }
        });

        const theater = document.getElementById('video-theater');
        const theaterRoot = document.getElementById('video-embed-root');
        const closeTheater = document.getElementById('close-video');

        function getYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        closeTheater.addEventListener('click', () => {
            gsap.to(theater, { opacity: 0, duration: 0.4, onComplete: () => {
                theater.style.display = 'none';
                theaterRoot.innerHTML = '';
                document.body.classList.remove('video-open');
            }});
        });


        function bindCardBehaviour() {
        document.querySelectorAll('.card-wrap').forEach(card => {

            const playBtn = card.querySelector('.play-trigger');
            if (playBtn) {
                playBtn.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    
                    const url = card.getAttribute('data-video-url');
                    const id = getYoutubeId(url);
                    if (id) {
                        theaterRoot.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                        theater.style.display = 'flex';
                        document.body.classList.add('video-open');
                        gsap.to(theater, { opacity: 1, duration: 0.3, ease: "power2.out" }); 
                    }
                });
            }


            card.addEventListener('click', () => {
                const videoUrl = card.getAttribute('data-video-url');
                const externalUrl = card.getAttribute('data-external-url');

                if (videoUrl || externalUrl) {
                    window.open(videoUrl || externalUrl, '_blank');
                    return;
                }

                const articleId = card.getAttribute('data-article-id');
                if (articleId && intelDB[articleId]) {
                    openArticle(articleId);
                }
            });
        });
        }

        gsap.registerPlugin(ScrollTrigger);

        const lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
        window.lenis = lenis;
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);


        function bindFilters() {
        const buttons = document.querySelectorAll('.f-item');
        const cards = document.querySelectorAll('.card-wrap');

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                

                buttons.forEach(b => {
                    b.classList.remove('text-black', 'active');
                    b.classList.add('text-black/40');
                    const line = b.querySelector('.f-line');
                    if(line) {
                        line.classList.remove('scale-x-100');
                        line.classList.add('scale-x-0');
                    }
                });


                btn.classList.add('text-black', 'active');
                btn.classList.remove('text-black/40');
                const activeLine = btn.querySelector('.f-line');
                if(activeLine) {
                    activeLine.classList.add('scale-x-100');
                    activeLine.classList.remove('scale-x-0');
                }
                
                const filter = btn.getAttribute('data-filter');

                gsap.to(cards, { 
                    opacity: 0, y: 20, scale: 0.98, duration: 0.3, stagger: 0.02,
                    onComplete: () => {
                        cards.forEach(card => {
                            card.style.display = (filter === 'all' || card.getAttribute('data-category') === filter) ? '' : 'none';
                        });
                        gsap.to(cards, { opacity: 1, y: 0, scale: 1, duration: 0.6, stagger: 0.05, ease: "power3.out" });
                        ScrollTrigger.refresh();
                    }
                });
            });
        });
        }


        document.querySelectorAll(".reveal-up").forEach(el => {

            if (el.style.opacity === "0") {
                gsap.to(el, { y: 0, opacity: 1, duration: 1.5, ease: "power4.out", scrollTrigger: { trigger: el, start: "top 95%" } });
            } else {
                gsap.from(el, { y: 100, opacity: 0, duration: 1.5, ease: "power4.out", scrollTrigger: { trigger: el, start: "top 95%" } });
            }
        });
        gsap.from(".reveal-right", { x: 100, opacity: 0, duration: 1.5, scrollTrigger: { trigger: ".reveal-right", start: "top 95%" } });
        gsap.from(".reveal-left", { x: -100, opacity: 0, duration: 1.5, scrollTrigger: { trigger: ".reveal-left", start: "top 95%" } });

        const playButton = (label) => `
                    <div class="play-trigger">
                        <button class="play-btn" aria-label="Play ${label}">
                            <svg viewBox="0 0 68 48"><path d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,0.13,34,0,34,0S12.21,0.13,6.9,1.55 c-2.93,0.78-4.64,3.26-5.42,6.19C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z" fill="#ff0000"></path><path d="M45,24L27,14v20L45,24z" fill="#fff"></path></svg>
                        </button>
                    </div>`;

        const escapeAttr = (value) => String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        const escapeText = (value) => String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        function cardMarkup(post) {
            const videoId = post.videoUrl ? getYoutubeId(post.videoUrl) : null;
            const destination = post.linkUrl || post.externalUrl || (videoId ? 'https://youtu.be/' + videoId : post.videoUrl);

            const anchor = destination
                ? `<a href="${escapeAttr(destination)}" target="_blank" rel="noopener" class="c-link">${escapeText(post.linkLabel)}</a>`
                : `<a href="javascript:void(0)" class="c-link">${escapeText(post.linkLabel)}</a>`;

            const hook = post.kind === 'video'
                ? ` data-video-url="${escapeAttr(post.videoUrl)}"`
                : post.kind === 'external'
                    ? ` data-external-url="${escapeAttr(post.externalUrl)}"`
                    : ` data-article-id="${escapeAttr(post.slug)}"`;

            const imageClass = post.imageClass ? `card-img ${escapeAttr(post.imageClass)}` : 'card-img';

            const media = `
                <div class="card-media">
                    <img loading="lazy" decoding="async" src="${escapeAttr(post.image)}" class="${imageClass}" alt="${escapeAttr(post.imageAlt)}" title="${escapeAttr(post.imageTitle)}">${post.hasPlayButton ? playButton(escapeAttr(post.title)) : ''}
                </div>`;

            const body = `
                <div class="card-body">
                    <h2 class="c-title">${escapeText(post.title)}</h2>
                    <p class="c-excerpt">${escapeText(post.excerpt)}</p>
                    ${anchor}
                </div>`;

            const inner = post.layout === 'featured' ? body + media : media + body;

            return `
            <div class="card-wrap ${post.layout}-card reveal-up" data-category="${escapeAttr(post.category)}"${hook}>${inner}
            </div>`;
        }

        function revealCards(elements) {
            elements.forEach(el => {
                gsap.from(el, {
                    y: 100, opacity: 0, duration: 1.5, ease: "power4.out",
                    scrollTrigger: { trigger: el, start: "top 95%" }
                });
            });
            ScrollTrigger.refresh();
        }

        async function loadNewsroom() {
            const grid = document.querySelector('.news-grid');
            if (!grid) return;

            let posts = [];
            try {
                const feed = await (window.newsroomFeed || fetch('/api/posts', { headers: { Accept: 'application/json' } }).then(r => (r.ok ? r.json() : null)));
                posts = (feed && feed.posts) || [];
            } catch (error) {
                console.error('Newsroom could not be loaded');
            }

            if (!posts.length) {
                grid.innerHTML = '<p class="newsroom-empty">No entries published yet.</p>';
                return;
            }

            grid.innerHTML = posts.map(cardMarkup).join('\n');

            posts.filter(post => post.kind === 'article').forEach(post => {
                intelDB[post.slug] = { title: post.title, img: post.image };
            });

            bindCardBehaviour();
            bindFilters();
            revealCards(Array.from(grid.querySelectorAll('.card-wrap')));

            const opening = decodeURIComponent(window.location.hash.replace('#', ''));
            if (opening && intelDB[opening]) openArticle(opening);
        }

        loadNewsroom();


        window.addEventListener("mousemove", (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 30;
            const y = (e.clientY / window.innerHeight - 0.5) * 30;
            gsap.to(".m-img", { x: x, y: y, duration: 2, ease: "power2.out" });
        });

        function initMobileMenu() {
            const btns = document.querySelectorAll('.mobile-menu-toggle-modern');
            const overlay = document.getElementById('mobile-menu-overlay');

            if (!btns.length || !overlay) return;

            btns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopImmediatePropagation();
                    const opened = this.classList.toggle('open');
                    this.setAttribute('aria-expanded', opened ? 'true' : 'false');
                    

                    btns.forEach(b => {
                        if (b !== this) {
                            if (opened) b.classList.add('open');
                            else b.classList.remove('open');
                            b.setAttribute('aria-expanded', opened ? 'true' : 'false');
                        }
                    });

                    if (opened) {
                        overlay.style.display = 'flex';
                        document.body.style.overflow = 'hidden';
                    } else {
                        overlay.style.display = 'none';
                        document.body.style.overflow = '';
                    }
                });
            });


            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    btns.forEach(btn => {
                        btn.classList.remove('open');
                        btn.setAttribute('aria-expanded', 'false');
                    });
                    overlay.style.display = 'none';
                    document.body.style.overflow = '';
                }
            });


            overlay.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    btns.forEach(btn => {
                        btn.classList.remove('open');
                        btn.setAttribute('aria-expanded', 'false');
                    });
                    overlay.style.display = 'none';
                    document.body.style.overflow = '';
                });
            });
        }

        document.addEventListener('DOMContentLoaded', initMobileMenu);


        window.addEventListener('scroll', function() {
            const nav = document.getElementById('main-nav');
            if (nav) {
                if (window.scrollY > 0) {
                    nav.classList.add('nav-scrolled');
                } else {
                    nav.classList.remove('nav-scrolled');
                }
            }
        });


        function toggleSearch() {
            const overlay = document.getElementById('search-overlay');
            overlay.classList.toggle('is-open');
            if(overlay.classList.contains('is-open')) {
                overlay.querySelector('input').focus();
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }


        const searchInput = document.querySelector('#search-overlay input');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const links = document.querySelectorAll('#search-overlay a');
                links.forEach(link => {
                    if (link.textContent.toLowerCase().includes(query)) {
                        link.style.display = 'block';
                    } else {
                        link.style.display = 'none';
                    }
                });
            });
        }


        (function() {
            function initMobileMenu() {
                const btn = document.querySelector('.mobile-menu-toggle-modern');
                const overlay = document.getElementById('mobile-menu-overlay');
                
                if (!btn || !overlay) return;
                

                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isOpen = this.classList.toggle('open');
                    this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                    
                    if (isOpen) {
                        overlay.style.display = 'flex';
                        document.body.style.overflow = 'hidden';
                    } else {
                        overlay.style.display = 'none';
                        document.body.style.overflow = '';
                    }
                });
                

                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) {
                        closeMobileMenu();
                    }
                });
                

                overlay.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', closeMobileMenu);
                });
                

                overlay.querySelectorAll('.nav-toggle').forEach(toggleBtn => {
                    toggleBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dropdown = this.nextElementSibling;
                        const chevron = this.querySelector('.nav-chevron');
                        const isCurrentlyOpen = dropdown && dropdown.classList.contains('open');
                        

                        overlay.querySelectorAll('.nav-dropdown').forEach(dd => {
                            dd.classList.remove('open');
                        });
                        overlay.querySelectorAll('.nav-toggle').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        overlay.querySelectorAll('.nav-chevron').forEach(ch => {
                            ch.style.transform = 'rotate(0deg)';
                        });
                        

                        if (!isCurrentlyOpen && dropdown && dropdown.classList.contains('nav-dropdown')) {
                            dropdown.classList.add('open');
                            this.classList.add('active');
                            if (chevron) chevron.style.transform = 'rotate(180deg)';
                        }
                    });
                });
            }
            
            function closeMobileMenu() {
                const btn = document.querySelector('.mobile-menu-toggle-modern');
                const overlay = document.getElementById('mobile-menu-overlay');
                
                if (btn) {

                    btn.setAttribute('aria-expanded', 'false');
